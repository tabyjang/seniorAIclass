          { id: 32, name: "우리 가족 AI 학교", description: "10회 강의 완료", icon: "🏫", criteria: "10회 강의 완료", proof: "가족 수료증 6장", details: ["가족 대상 교육", "10회 강의", "수료증 발급"] },
          { id: 33, name: "AI봉사단", description: "지역사회 5회 강의", icon: "🤝", criteria: "지역사회 5회", proof: "봉사활동 확인증", details: ["경로당 강의", "도서관 강의", "수강생 50명"] },
          { id: 34, name: "AI 컨설턴트 포트폴리오", description: "3건 수행", icon: "✅", criteria: "프로젝트 3건 완료", proof: "수익 인증", details: ["포트폴리오 문서", "수익 300만원+"] },
          { id: 35, name: "AI 전문가 인증", description: "공식 강사 등록", icon: "🏆", criteria: "공식 강사 등록", proof: "명함 + 등록번호", details: ["AI 전문가 수료증", "강사 네트워크 가입"] },
          { id: 36, name: "AI 강사 브랜드", description: "개인 브랜딩", icon: "👤", criteria: "개인 브랜딩", proof: "강사 홈페이지", details: ["개인 홈페이지", "포트폴리오", "연락처"] },
          { id: 37, name: "AI 교육 채널", description: "구독자 500명", icon: "📺", criteria: "구독자 500명", proof: "월 수익 50만원+", details: ["유튜브 채널", "정기 업로드", "수익화"] },
          { id: 38, name: "AI 비즈니스 모델", description: "3가지 수익원", icon: "💰", criteria: "3가지 수익원", proof: "월 100만원 수익", details: ["강의 수익", "컨설팅 수익", "콘텐츠 수익"] },
          { id: 39, name: "AI 멘토링", description: "후배 3명 양성", icon: "👥", criteria: "후배 3명 양성", proof: "멘토링 수료증", details: ["멘티 선발", "교육 진행", "수료 인증"] },
          { id: 40, name: "AI 사회공헌", description: "프로젝트 1건", icon: "🏠", criteria: "프로젝트 1건", proof: "감사장/표창장", details: ["사회공헌 기획", "실행", "인정"] }
        ]
      }
    };

    let currentLevel = 1;
    let expandedProductId = null;

    function setLevel(level) {
      currentLevel = level;
      expandedProductId = null;
      updateUI();
    }

    function toggleProduct(id) {
      expandedProductId = expandedProductId === id ? null : id;
      renderProducts();
    }

    function updateUI() {
      const data = levelsData[currentLevel];

      // 탭 업데이트
      document.querySelectorAll('.level-tab').forEach((tab, idx) => {
        const lvl = idx + 1;
        if (lvl === currentLevel) {
          tab.classList.add('active');
          tab.style.backgroundColor = levelsData[lvl].color;
          tab.classList.remove('bg-gray-100', 'text-gray-600');
          tab.classList.add('text-white');
        } else {
          tab.classList.remove('active');
          tab.style.backgroundColor = '';
          tab.classList.add('bg-gray-100', 'text-gray-600');
          tab.classList.remove('text-white');
        }
      });

      // 레벨 정보 카드 업데이트
      const levelInfo = document.getElementById('level-info');
      levelInfo.style.backgroundColor = data.bgColor;
      levelInfo.style.setProperty('--level-color', data.color);

      document.getElementById('level-badge').textContent = `Lv.${currentLevel}`;
      document.getElementById('level-badge').style.backgroundColor = data.color;
      document.getElementById('level-name').textContent = data.name;
      document.getElementById('level-slogan').textContent = `"${data.slogan}"`;
      document.getElementById('level-lectures').textContent = `${data.lectures}강`;
      document.getElementById('level-lectures').style.color = data.color;
      document.getElementById('level-duration').textContent = data.duration;
      document.getElementById('level-duration').style.color = data.color;

      // 프로덕트 카운트 색상
      levelInfo.querySelectorAll('.text-2xl.font-bold').forEach(el => {
        el.style.color = data.color;
      });

      renderProducts();
    }

    function renderProducts() {
      const data = levelsData[currentLevel];
      const grid = document.getElementById('products-grid');

      grid.innerHTML = data.products.map((product, idx) => `
        <div class="product-card bg-white border-2 border-gray-100 rounded-2xl overflow-hidden hover:border-gray-200" style="animation: fadeIn 0.3s ease ${idx * 0.05}s both;">
          <button onclick="toggleProduct(${product.id})" class="w-full p-5 text-left hover:bg-gray-50 transition-colors">
            <div class="flex items-start gap-4">
              <div class="w-14 h-14 rounded-xl flex items-center justify-center text-white flex-shrink-0 text-2xl" style="background-color: ${data.color};">
                ${product.icon}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-sm font-medium text-gray-400">#${product.id}</span>
                  <h4 class="font-bold text-gray-800 text-lg">${product.name}</h4>
                </div>
                <p class="text-gray-600 text-sm">${product.description}</p>
              </div>
              <div class="text-gray-400 flex-shrink-0 transform transition-transform ${expandedProductId === product.id ? 'rotate-180' : ''}">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
              </div>
            </div>
          </button>
          <div class="product-details ${expandedProductId === product.id ? 'open' : ''}">
            <div class="px-5 pb-5 pt-2 border-t border-gray-100">
              <div class="mb-4">
                <h5 class="text-sm font-bold text-gray-500 mb-2">완성 기준</h5>
                <p class="text-gray-800 font-medium">${product.criteria}</p>
              </div>
              <div class="mb-4">
                <h5 class="text-sm font-bold text-gray-500 mb-2">증명 방식</h5>
                <p class="text-gray-600">${product.proof}</p>
              </div>
              <div class="mb-4">
                <h5 class="text-sm font-bold text-gray-500 mb-2">포함 내용</h5>
                <ul class="space-y-1">
                  ${product.details.map(detail => `
                    <li class="flex items-center gap-2 text-sm text-gray-600">
                      <svg class="w-4 h-4 flex-shrink-0" style="color: ${data.color};" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                      ${detail}
                    </li>
                  `).join('')}
                </ul>
              </div>
              <a href="/#contact" class="flex items-center justify-center gap-2 w-full py-3 rounded-xl text-white font-medium transition-opacity hover:opacity-90" style="background-color: ${data.color};">
                이 프로덕트 만들기
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 초기화
    updateUI();
  </script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</body>
</html>
