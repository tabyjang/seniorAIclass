<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온라인 포토 앨범 - 앨범 목록</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #FFFFFF;
            color: #2C2C2C;
        }

        /* 헤더 */
        .header {
            background: #FFFFFF;
            border-bottom: 1px solid #E0E0E0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #2C2C2C;
        }

        .logo-icon {
            font-size: 2rem;
        }

        .btn-primary {
            background: #D4A52C;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-primary:hover {
            background: #B8941F;
        }

        /* 메인 컨테이너 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        /* 페이지 제목 */
        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
        }

        /* 앨범 그리드 */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        /* 앨범 카드 */
        .album-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .album-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .album-cover {
            aspect-ratio: 4/3;
            position: relative;
            overflow: hidden;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-count {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .album-info {
            padding: 20px;
        }

        .album-info h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #2C2C2C;
        }

        .album-info p {
            color: #666666;
            font-size: 0.95rem;
        }

        /* 새 앨범 카드 */
        .new-album-card {
            background: #F9F9F9;
            border: 3px dashed #D4A52C;
            border-radius: 16px;
            aspect-ratio: 4/3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 250px;
        }

        .new-album-card:hover {
            background: #FFF9E6;
            border-style: solid;
            transform: translateY(-5px);
        }

        .new-album-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            color: #D4A52C;
        }

        .new-album-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #D4A52C;
        }

        .new-album-hint {
            font-size: 0.9rem;
            color: #999;
            margin-top: 8px;
        }

        /* 푸터 */
        .footer {
            text-align: center;
            padding: 60px 40px 40px;
            color: #666666;
            border-top: 1px solid #E0E0E0;
            margin-top: 80px;
        }

        .footer p {
            font-size: 1rem;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }

            .container {
                padding: 20px;
            }

            .page-title {
                font-size: 1.5rem;
            }

            .album-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 20px;
            }
        }

        @media (max-width: 480px) {
            .album-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="logo">
            <span class="logo-icon">📷</span>
            <span>온라인 포토 앨범</span>
        </div>
        <button class="btn-primary">+ 새 앨범</button>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="container">
        <h1 class="page-title">내 앨범</h1>

        <!-- 앨범 그리드 -->
        <div class="album-grid">
            <!-- 앨범 1 -->
            <div class="album-card">
                <div class="album-cover">
                    <img src="https://picsum.photos/400/300?random=1" alt="손주 사진">
                    <span class="photo-count">12장</span>
                </div>
                <div class="album-info">
                    <h3>손주 사진</h3>
                    <p>2024년 손주 성장 기록</p>
                </div>
            </div>

            <!-- 앨범 2 -->
            <div class="album-card">
                <div class="album-cover">
                    <img src="https://picsum.photos/400/300?random=2" alt="제주도 여행">
                    <span class="photo-count">8장</span>
                </div>
                <div class="album-info">
                    <h3>제주도 여행</h3>
                    <p>2024.01 가족 여행</p>
                </div>
            </div>

            <!-- 앨범 3 -->
            <div class="album-card">
                <div class="album-cover">
                    <img src="https://picsum.photos/400/300?random=3" alt="동창회 모임">
                    <span class="photo-count">25장</span>
                </div>
                <div class="album-info">
                    <h3>동창회 모임</h3>
                    <p>30년 만의 동창회</p>
                </div>
            </div>

            <!-- 앨범 4 -->
            <div class="album-card">
                <div class="album-cover">
                    <img src="https://picsum.photos/400/300?random=4" alt="가족 모임">
                    <span class="photo-count">6장</span>
                </div>
                <div class="album-info">
                    <h3>가족 모임</h3>
                    <p>명절 가족 모임</p>
                </div>
            </div>

            <!-- 앨범 5 -->
            <div class="album-card">
                <div class="album-cover">
                    <img src="https://picsum.photos/400/300?random=5" alt="꽃 구경">
                    <span class="photo-count">15장</span>
                </div>
                <div class="album-info">
                    <h3>벚꽃 구경</h3>
                    <p>2024 봄 벚꽃 나들이</p>
                </div>
            </div>

            <!-- 새 앨범 만들기 -->
            <div class="new-album-card">
                <span class="new-album-icon">+</span>
                <span class="new-album-text">새 앨범 만들기</span>
                <span class="new-album-hint">사진을 업로드하고 공유하세요</span>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="footer">
        <p>📷 온라인 포토 앨범 - 소중한 추억을 안전하게 보관하세요</p>
    </footer>
</body>
</html>
